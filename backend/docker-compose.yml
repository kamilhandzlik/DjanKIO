services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: djankio-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:latest
    container_name: djankio-db
    environment:
      POSTGRES_USER: postgresqluser
      POSTGRES_PASSWORD: postgresqlpassword
      POSTGRES_DB: djankio_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
